# Infrastructure only by default:   docker compose up -d     (or: npm run infra)
# With the app containers too:       docker compose --profile app up -d --build

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quarry}
      POSTGRES_DB: ${POSTGRES_DB:-quarry}
      GOTRUE_DB_NAME: ${GOTRUE_DB_NAME:-gotrue}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quarry}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Disposable: everything durable is in Postgres, schedulers are rebuilt on boot.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotrue:
    image: supabase/auth:v2.177.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-http://localhost:9999}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-quarry}@postgres:5432/${GOTRUE_DB_NAME:-gotrue}?sslmode=disable&search_path=auth
      GOTRUE_SITE_URL: ${APP_URL:-http://localhost:5173}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL:-http://localhost:5173}
      # Membership is granted by an admin (identity.user); signing up alone grants nothing.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-dev-jwt-secret-change-me-0123456789abcdef}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    ports:
      - "${GOTRUE_PORT:-9999}:9999"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-quarry}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-quarry-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY:-quarry}" "${S3_SECRET_KEY:-quarry-secret}" &&
        mc mb --ignore-existing "local/${S3_BUCKET:-datasets}"

  # ── app (profile "app") — one image, three packages ─────────────────────────

  # packages/server — the CRUD API, plus /api/internal/… for the workers. The only container with database access.
  server:
    profiles: [app]
    build: .
    image: quarry:latest
    restart: unless-stopped
    command: ["node", "packages/server/dist/server/src/api.js"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-quarry}@postgres:5432/${POSTGRES_DB:-quarry}
      REDIS_URL: redis://redis:6379
      GOTRUE_URL: http://gotrue:9999
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-dev-jwt-secret-change-me-0123456789abcdef}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quarry}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quarry-secret}
      S3_BUCKET: ${S3_BUCKET:-datasets}
      QUARRY_INTERNAL_TOKEN: ${QUARRY_INTERNAL_TOKEN:-dev-internal-token-change-me}
      QUARRY_ENCRYPTION_KEY: ${QUARRY_ENCRYPTION_KEY:?set QUARRY_ENCRYPTION_KEY (openssl rand -hex 32)}
      PORT: 4000
      CORS_ORIGIN: ${APP_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-4000}:4000"

  # packages/data-connection-worker — the only container that reaches source systems; it decrypts their credentials.
  # No DATABASE_URL: run bookkeeping goes through the server's /internal API.
  data-connection-worker:
    profiles: [app]
    image: quarry:latest
    restart: unless-stopped
    command: ["node", "packages/data-connection-worker/dist/data-connection-worker/src/main.js"]
    depends_on:
      server: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4101/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      WORKER_PORT: 4101
      REDIS_URL: redis://redis:6379
      QUARRY_SERVER_URL: http://server:4000
      QUARRY_INTERNAL_TOKEN: ${QUARRY_INTERNAL_TOKEN:-dev-internal-token-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-quarry}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-quarry-secret}
      S3_BUCKET: ${S3_BUCKET:-datasets}
      QUARRY_ENCRYPTION_KEY: ${QUARRY_ENCRYPTION_KEY:?set QUARRY_ENCRYPTION_KEY (openssl rand -hex 32)}

  # packages/system-worker — housekeeping on a schedule. No DATABASE_URL either.
  system-worker:
    profiles: [app]
    image: quarry:latest
    restart: unless-stopped
    command: ["node", "packages/system-worker/dist/system-worker/src/main.js"]
    depends_on:
      server: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4102/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      WORKER_PORT: 4102
      REDIS_URL: redis://redis:6379
      QUARRY_SERVER_URL: http://server:4000
      QUARRY_INTERNAL_TOKEN: ${QUARRY_INTERNAL_TOKEN:-dev-internal-token-change-me}

volumes:
  postgres-data:
  minio-data:
